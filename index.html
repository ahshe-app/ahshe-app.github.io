<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AHSHE</title>
<meta name="theme-color" content="#1F5673">
<meta name="description" content="App das sócias AHSHE: abastecimento, estoque, vendas e lucro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AHSHE">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: barra de marca no topo + abas; conteúdo em cards claros; botão "+ Lançar" fixo; tudo em uma coluna no celular.
   Visual claro de propósito (cores da marca AHSHE: laranja do toldo e azul-petróleo do logo). */
:root{
  color-scheme:light;
  --bg:#F4F7F8; --panel:#FFFFFF; --soft:#F0F4F6; --line:#E1E8EB;
  --ink:#16323F; --muted:#5D7480; --faint:#93A6AF;
  --petrol:#1F5673; --petrol-2:#2C7196; --petrol-soft:#E3EEF4;
  --orange:#EC6A1C; --orange-2:#F5893F; --orange-soft:#FDECDF;
  --ok:#1D8752; --ok-soft:#E0F3E8; --warn:#A86A12; --warn-soft:#FBF0D9; --bad:#BF3A2C; --bad-soft:#FBE4E1;
  --display:"Baloo 2",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --body:"Nunito Sans",ui-sans-serif,"Segoe UI",system-ui,sans-serif;
  --r:18px;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
:focus-visible{outline:3px solid var(--orange-2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* Topo */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.topbar-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:18px;min-height:64px}
.logo{display:flex;align-items:center;gap:8px;flex:none}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--petrol);display:grid;place-items:center;position:relative}
.logo-mark svg{width:22px;height:22px;color:#fff}
.logo-mark i{position:absolute;right:-5px;top:-5px;width:18px;height:18px;border-radius:50%;background:var(--orange);color:#fff;font:800 8px/18px var(--body);text-align:center;font-style:normal}
.logo b{font-family:var(--display);font-weight:800;font-size:24px;color:var(--petrol);letter-spacing:.02em;line-height:1}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;border-radius:12px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--soft);color:var(--ink)}
.tabs button[aria-current="true"]{background:var(--petrol-soft);color:var(--petrol)}
.tabs .dot{min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.me{flex:none;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.me img{width:30px;height:30px;border-radius:50%}

main{max-width:1180px;margin:0 auto;padding-block:24px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head h1{font-size:clamp(28px,4vw,38px);font-weight:800;color:var(--ink)}
.head p{margin:2px 0 0;color:var(--muted)}
section{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.card h2{font-size:21px;font-weight:700}
.card .sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* Alertas */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--orange);border-radius:14px;padding:11px 14px;font-weight:600}
.alert.ok{border-left-color:var(--ok)}
.alert.info{border-left-color:var(--petrol)}
.alert svg{width:20px;height:20px;flex:none;color:var(--orange)}
.alert.info svg{color:var(--petrol)}
.alert span{flex:1;min-width:0}
.alert button{flex:none}

/* Cards de negócio */
.biz{padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);font:inherit;color:inherit}
.biz:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(22,50,63,.09)}
.biz-img{position:relative;aspect-ratio:16/10;background:linear-gradient(160deg,var(--petrol-soft),#fff);display:grid;place-items:center;overflow:hidden;max-width:100%}
.biz-img img{width:100%;height:100%;object-fit:cover}
.biz-img svg{height:86%;width:auto;max-width:90%}
.biz-img .pill{position:absolute;left:12px;top:12px}
.biz-img .flag{position:absolute;right:12px;top:12px;left:auto}
.biz-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px}
.biz-body h3{font-size:22px;font-weight:800}
.biz-body .where{color:var(--muted);font-size:13.5px;margin-top:-8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--soft);border-radius:12px;padding:10px 12px}
.duo .k{font-size:12px;font-weight:700;color:var(--muted)}
.duo .v{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.duo .v.good{color:var(--ok)}.duo .v.badv{color:var(--bad)}
.biz-foot{font-size:12.5px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--petrol-soft);color:var(--petrol)}
.pill.orange{background:var(--orange-soft);color:var(--orange)}
.pill.plain::before{display:none}
.est{font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}

/* Faixa das sócias */
.strip{background:var(--petrol);color:#fff;border-radius:var(--r);padding:18px 20px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.strip .k{font-size:12.5px;font-weight:700;color:#BFD6E2}
.strip .v{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.strip .f{font-size:12.5px;color:#BFD6E2}
.strip h2{grid-column:1/-1;font-size:18px;font-weight:700;color:#fff}

/* Hero de negócio */
.hero{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:0;padding:0;overflow:hidden}
.hero .biz-img{aspect-ratio:auto;min-height:220px;height:100%}
.hero-body{padding:20px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big3 div{background:var(--soft);border-radius:14px;padding:12px 14px}
.big3 .k{font-size:12.5px;font-weight:700;color:var(--muted)}
.big3 .v{font-family:var(--display);font-size:clamp(22px,2.6vw,30px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero .biz-img{aspect-ratio:16/10;min-height:0}.big3{grid-template-columns:1fr 1fr}.big3 div:last-child{grid-column:1/-1}}

.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:7px 14px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--petrol);color:#fff}
.seg button[disabled]{opacity:.5;cursor:not-allowed}

/* Pendências */
.todo{border:1px solid #F6C9A6;background:#FFF8F2}
.todo-item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid #F6D9C2}
.todo-item:first-of-type{border-top:0;padding-top:4px}
.todo-item b{font-weight:800}
.todo-item .help{color:var(--muted);font-size:13px;margin:-4px 0 0}
.todo-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.todo-row .field{flex:1 1 220px}
details.done-list{margin-top:6px;font-size:13.5px}
details.done-list summary{cursor:pointer;color:var(--muted);font-weight:700}
.answer{background:var(--ok-soft);border-radius:10px;padding:8px 12px;margin-top:6px;white-space:pre-wrap}
.answer small{display:block;color:var(--muted);font-size:12px}

/* Botões e formulários */
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 15px;font-weight:800;font-size:14px;display:inline-flex;gap:7px;align-items:center;justify-content:center;color:var(--ink)}
.btn:hover{border-color:var(--petrol-2)}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:#fff}
.btn.primary:hover{background:var(--petrol-2)}
.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--petrol)}
.btn.small{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.photo-btn{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);border:0;color:var(--ink);font-size:12px;padding:6px 10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-width:0;font-size:15px}
.field textarea{min-height:70px;resize:vertical}
.field.wide{grid-column:1/-1}
.checks{display:flex;gap:14px;flex-wrap:wrap;padding-top:6px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink);font-weight:600}
.checks input{width:auto}

/* Tabelas */
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:800;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 12px;font-size:14px}
.prog{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.prog>div{height:100%;background:var(--orange);border-radius:6px}
.prog.p>div{background:var(--petrol)}
.mbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.mbar .track{width:60px;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.mbar .fill{display:block;height:100%;background:var(--petrol);border-radius:4px}
details.more{border-top:1px solid var(--line);margin-top:4px;padding-top:12px}
details.more>summary{cursor:pointer;font-weight:800;color:var(--petrol);list-style:none;display:flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"+";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--petrol-soft)}
details.more[open]>summary::before{content:"−"}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}

/* Charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .gl{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:8px 10px;border-radius:10px;white-space:nowrap;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.18);line-height:1.45}

/* Etapas */
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;padding:0;margin:0}
.steps li{flex:1 1 130px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13.5px;color:var(--muted);font-weight:600}
.steps li b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.steps li.done{background:var(--ok-soft);color:var(--ok)}
.steps li.now{background:var(--orange-soft);color:var(--orange);outline:2px solid var(--orange)}

/* Estoque */
.stock-tabs{display:flex;gap:8px;flex-wrap:wrap}
.qty{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.stepper button{all:unset;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--petrol);background:var(--soft)}
.stepper input{width:54px;border:0;text-align:center;font-weight:800;font-size:16px;padding:0;height:36px;background:var(--panel)}

/* Fornecedores */
.forn{display:flex;flex-direction:column;gap:12px}
.forn-head{display:flex;gap:12px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:14px;background:var(--petrol-soft);color:var(--petrol);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;flex:none}
.forn-head h3{font-size:19px}
.forn-head p{margin:0;color:var(--muted);font-size:13.5px}
.contacts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.contacts li{display:flex;gap:8px;font-size:14px;min-width:0}
.contacts .k{color:var(--muted);font-size:12.5px;font-weight:700;width:80px;flex:none}
.contacts .v{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all}
.contacts a{color:var(--orange);font-weight:800;text-decoration:none;font-size:13px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:800;border-radius:7px;padding:2px 7px;background:var(--soft);color:var(--faint)}
.chip.on{background:var(--petrol-soft);color:var(--petrol)}
.editor{border-color:var(--petrol);box-shadow:0 0 0 4px var(--petrol-soft)}

/* Início em cards */
.hgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:860px){.hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:561px){.hc.v2{grid-column:span 2}}
@media (max-width:560px){.hgrid{grid-template-columns:1fr 1fr;gap:10px}}
.hc{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:3px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(20,40,55,.04),0 6px 18px -12px rgba(20,40,55,.18);transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.hc:hover{border-color:var(--petrol-2);box-shadow:0 2px 4px rgba(20,40,55,.06),0 12px 26px -14px rgba(20,40,55,.28)}
.hc:active{transform:scale(.985)}
.hc:focus-visible{outline:3px solid var(--petrol-2);outline-offset:2px}
.hc.wide{grid-column:1/-1}
.hc.plain{cursor:default}.hc.plain:hover{border-color:var(--line)}.hc.plain:active{transform:none}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.hc .ic{width:42px;height:42px;border-radius:13px;background:var(--petrol-soft);color:var(--petrol);display:grid;place-items:center;flex:none}
.hc .ic svg{width:23px;height:23px}
.hc .ic.ok{background:var(--ok-soft);color:var(--ok)}
.hc .ic.warm{background:var(--orange-soft);color:#C9560F}
.hc-top>svg{width:22px;height:22px;opacity:.8}
.hc-k{font-size:12.5px;font-weight:800;color:var(--muted);letter-spacing:.01em}
.hc-v{font-family:var(--display);font-size:clamp(20px,5.4vw,27px);font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hc-s{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.35}
.hc .warn-t{color:#B5530E;font-weight:700}
.hc .badge{min-width:24px;height:24px;border-radius:12px;background:var(--orange);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;padding:0 7px;box-sizing:border-box}
.hc .trend{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;white-space:nowrap}
.hc .trend.up{background:var(--ok-soft);color:var(--ok)}.hc .trend.down{background:var(--bad-soft);color:var(--bad)}
.hc .spark{display:block;width:100%;height:34px;margin-top:8px}
.hc.hero{background:linear-gradient(135deg,#C9560F,#EC6A1C);border-color:#C9560F;color:#fff;padding:18px 20px}
.hc.hero .ic{background:rgba(255,255,255,.18);color:#fff}.hc.hero .hc-k{color:#FFE2CF;text-transform:uppercase;letter-spacing:.06em}.hc.hero .hc-s{color:#FFE7D8}
.hc.hero .hc-v{font-size:clamp(22px,6vw,30px)}
.hc.calm{background:var(--ok-soft);border-color:#CBE6D6}
.hc-dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hc-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;border-radius:99px;padding:5px 10px;background:rgba(255,255,255,.18);color:inherit}
.hc-dot i{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.hc.calm .hc-dot{background:#fff;color:var(--ink)}
.hc-dot.ok{opacity:.75}
.hc-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.hc-acts button{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--soft);color:var(--petrol);font-weight:800;font-size:12.5px;text-align:center;line-height:1.15}
.hc-acts button:hover{background:var(--petrol-soft)}
.hc-acts svg{width:22px;height:22px}

    if(cl.tipo==="percentual")R.local+=rc*(+cl.valor||0)/100;else if(cl.tipo==="fixo")R.local+=(+cl.valor||0)*dd/30.4;
    else if(cl.tipo==="escalonado"&&cl.faixas){const f=cl.faixas.find(f=>f.ate==null||f.ate===""||rc<=+f.ate);R.local+=rc*((f&&+f.pct)||0)/100}
    if(a.tipo==="vending"||rc>0)R.fixos+=((+a.sistema||0)+(+a.energia||0))*dd/30.4;
  });
  const negs=negsDe(ids);

function cronograma(f){const out=[];const [y0,m0]=(f.primeira||curMes).split("-").map(Number);
  for(let k=0;k<(+f.n||0);k++){const y=y0+Math.floor((m0-1+k)/12),m=(m0-1+k)%12;let dt,pago;

function extrato(){

  ps.forEach(p=>{if(!alvo){p.status="info";return}const falta=Math.max(0,p.parte-p.pago);const add=Math.min(falta,pool);pool-=add;p.pago+=add;

    (v.itens||[]).forEach(it=>{const p=prodPorNome(it.p);if(!p)return;const st=ip[v.maquina+"|"+p.id];if(!st||ts<st)return;ev.push({local:v.maquina,pid:p.id,q:-(+it.q||0),ts,tipo:"venda"})})});
  ev.sort((a,b)=>a.ts<b.ts?-1:a.ts>b.ts?1:0);
  const E={};ev.forEach(e=>{const k=e.local;const m=E[k]||(E[k]={});const c=m[e.pid]||(m[e.pid]={qtd:0});if(e.tipo==="contagem")c.qtd=e.abs;else c.qtd+=e.q;c.ult=e.ts.slice(0,10)});
  return {E,inicio};
}
function ritmo(local,pid,dias=14){const uv=ultVenda(local);if(!uv)return 0;const ini=isoD(new Date(pd(uv).getTime()-(dias-1)*864e5));const p=S.produtos.find(x=>x.id===pid);if(!p)return 0;
  let q=0;S.vendas.filter(v=>v.maquina===local&&v.data>=ini&&v.data<=uv).forEach(v=>(v.itens||[]).forEach(it=>{if(prodPorNome(it.p)===p)q+=+it.q||0}));return q/dias}
function listaReposicao(local,est){const E=est.E[local]||{};const D=est.E.deposito||{};const out=[];

    if(falta>0)out.push({p,atual,alvo,falta,dep:D[p.id]?D[p.id].qtd:0,dias:r?Math.max(0,atual)/r:null})});
  return out.sort((a,b)=>(a.dias??99)-(b.dias??99));}
/* rota de abastecimento: o que cada ponto precisa e o que separar no depósito */
function rota(est){est=est||estoque();
  const pontos=ativosList().filter(a=>a.status!=="parada").map(a=>{const tracked=!!est.inicio[a.id];const lista=tracked?listaReposicao(a.id,est):[];
    const hoje=S.movimentos.some(m=>m.tipo==="reposicao"&&m.para===a.id&&m.data===HOJE);
    const urg=lista.filter(x=>x.dias!=null&&x.dias<3).length;
    return {a,tracked,lista,hoje,urg,precisa:!hoje&&lista.length>0}});
  const sep={};pontos.filter(p=>p.precisa).forEach(p=>p.lista.forEach(x=>{const o=sep[x.p.id]||(sep[x.p.id]={p:x.p,q:0,onde:[],dep:x.dep});o.q+=x.falta;o.onde.push(curto(p.a)+" "+x.falta)}));

/* validade por lote: cada compra com data de validade é um lote; o que sobrou sai do mais novo para o mais velho */
function lotes(est){est=est||estoque();const tot={},trk={};

  const acc={};return ls.map(l=>{const q=+l.qtd||0;const usado=acc[l.produtoId]||0;acc[l.produtoId]=usado+q;
    const resta=trk[l.produtoId]?Math.max(0,Math.min(q,tot[l.produtoId]-usado)):q;const p=S.produtos.find(x=>x.id===l.produtoId)||{nome:l.descricao};
    return {l,p,resta,dias:Math.round((pd(l.validade)-today)/864e5)}}).filter(x=>x.resta>0).sort((a,b)=>a.dias-b.dias)}

/* ---------- gráfico de barras ---------- */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function barChart(el,data,{color="var(--petrol)",height=200,fmtY=brl0,every=1}={}){
  if(!el)return;const W=Math.max(260,el.clientWidth||600),H=height,ml=50,mr=6,mt=10,mb=24;const max=niceMax(Math.max(1,...data.map(d=>d.v)));
  const iw=W-ml-mr,ih=H-mt-mb,bw=iw/Math.max(1,data.length),gap=Math.min(6,bw*.28);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
  for(let i=0;i<=4;i++){const v=max*i/4,y=mt+ih-ih*i/4;s+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y}" y2="${y}"${i?' stroke-dasharray="2 4"':""}/><text x="${ml-8}" y="${y+4}" text-anchor="end">${esc(fmtY(v))}</text>`}
  data.forEach((d,i)=>{const x=ml+i*bw+gap/2,w=Math.max(1,bw-gap),h=ih*d.v/max,y=mt+ih-h,r=Math.min(5,w/2,h);
    if(d.v>0)s+=`<path d="M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z" fill="${d.color||color}"/>`;
    if(i%every===0)s+=`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(d.label)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${ml+i*bw}" y="${mt}" width="${bw}" height="${ih}" fill="transparent"/>`});
  el.innerHTML=s+"</svg>";let tip=document.createElement("div");tip.className="tip";tip.hidden=true;el.appendChild(tip);
  el.querySelectorAll(".hit").forEach(r=>{const i=+r.dataset.i,d=data[i];r.addEventListener("pointerenter",()=>{tip.innerHTML=d.tip;tip.hidden=false;const sc=el.clientWidth/W;let left=(ml+i*bw+bw/2)*sc-tip.offsetWidth/2;left=Math.max(0,Math.min(el.clientWidth-tip.offsetWidth,left));tip.style.left=left+"px";tip.style.top=Math.max(0,(mt+ih-ih*d.v/max)*sc-tip.offsetHeight-10)+"px"});r.addEventListener("pointerleave",()=>tip.hidden=true)});
}

    ${lista.length?`<div class="card"><div class="card-head"><div><h2>O que levar para ${esc(LOCAIS[loc])}</h2><p class="sub">Para durar ~7 dias, pelo ritmo de vendas das últimas 2 semanas</p></div>${S.canWrite?`<button class="btn primary" data-sheet="repor" data-loc="${loc}" data-sug="1">Repor com essa lista</button>`:""}</div>
      <div class="tbl"><table><thead><tr><th>Produto</th><th class="r">Tem lá</th><th class="r">Levar</th><th class="r">No depósito</th></tr></thead><tbody>${lista.map(x=>`<tr><td>${esc(x.p.nome)}</td><td class="r">${n0(Math.max(0,x.atual))}</td><td class="r"><b>${x.falta}</b></td><td class="r" style="color:${x.dep<x.falta?"var(--bad)":"inherit"}">${n0(x.dep)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
    ${tracked||rows.length?`<div class="card"><div class="card-head"><div><h2>Produtos em ${esc(LOCAIS[loc])}</h2><p class="sub">${tracked?"Os que precisam de atenção aparecem primeiro":"Sem contagem ainda: as quantidades aparecem depois da primeira contagem"}</p></div></div>
      <div class="tbl"><table><thead><tr><th>Produto</th><th class="r">Quantidade</th><th>Situação</th><th class="r">Valor</th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td>${esc(x.p.nome)}</td><td class="r"><span class="qty">${x.q==null?"—":n0(Math.max(0,x.q))}</span></td><td>${x.st?`<span class="pill ${x.st[0]}">${esc(x.st[1])}</span>`:'<span class="note">sem contagem</span>'}</td><td class="r">${x.q==null?"":brl(Math.max(0,x.valor))}</td></tr>`).join("")}</tbody></table></div>
      ${loc==="deposito"?`<p class="note">Para receber aviso de produto acabando no depósito, defina o "mínimo no depósito" de cada produto em Cadastros › Produtos.</p>`:""}</div>`:""}
    ${movHist(loc)}
  </section>`;
}
function movHist(loc){const ms=S.movimentos.filter(m=>m.local===loc||m.de===loc||m.para===loc).sort((a,b)=>((b.data||"")+(b.criadoEm||""))<((a.data||"")+(a.criadoEm||""))?-1:1).slice(0,10);
  if(!ms.length)return "";const nome=id=>{const p=S.produtos.find(x=>x.id===id);return p?p.nome:id};
  return `<div class="card"><h2 style="margin-bottom:10px">Últimas movimentações</h2><div class="tbl"><table><tbody>${ms.map(m=>{const n=(m.itens||[]).reduce((s,i)=>s+(+i.qtd||0),0);
    const t=m.tipo==="reposicao"?`Reposição ${esc(LOCAIS[m.de]||m.de)} → ${esc(LOCAIS[m.para]||m.para)}`:m.tipo==="contagem"?`Contagem em ${esc(LOCAIS[m.local])}`:`Ajuste em ${esc(LOCAIS[m.local])}${m.motivo?" ("+esc(m.motivo)+")":""}`;
    return `<tr><td class="num">${fmtDM(m.data)}</td><td>${t}<br><span class="note">${(m.itens||[]).slice(0,4).map(i=>esc(nome(i.produtoId))+" ×"+n0(i.qtd)).join(" · ")}${(m.itens||[]).length>4?" …":""}</span></td><td class="r">${n0(n)} un</td><td class="r">${S.canWrite?(UI.confirmDel===m.id?`<button class="btn small danger" data-delx="movimentos/${esc(m.id)}">Confirmar</button>`:`<button class="btn small ghost" data-askdelx="${esc(m.id)}">Excluir</button>`):""}</td></tr>`}).join("")}</tbody></table></div></div>`}

/* ----- Financeiro ----- */
const CATDESP0=["Reposição e frete","Manutenção","Perdas e vencidos","Embalagens e limpeza","Taxas bancárias","Outros"];
function catsDesp(){const base=S.config.catDespesa&&S.config.catDespesa.length?S.config.catDespesa:CATDESP0;return [...new Set([...base,...S.lancamentos.filter(l=>l.tipo==="despesa"&&l.categoria).map(l=>l.categoria)])]}
const todosIds=()=>ativosList().map(a=>a.id);
/* negócio de cada financiamento: campo "negocio" no cadastro ou, sem ele, empréstimo = Villa Bella e os outros = as duas geladeiras */
const finNeg=(id,f)=>f.negocio||(id==="emprestimo"?"mm":"geladeiras");
function finPeso(id,f,ids){const n=finNeg(id,f);if(n==="geral")return ids.length>=todosIds().length?1:0;if(ids.includes(n))return 1;
  if(n==="geladeiras")return (ids.includes("g1")?.5:0)+(ids.includes("g2")?.5:0);return 0}
function parcelasEntre(ini,fim,ids){let tot=0;Object.entries(S.financiamentos).forEach(([id,f])=>{const w=finPeso(id,f,ids);if(!w)return;
  cronograma(f).forEach(c=>{const d=isoD(c.dt);if(d>=ini&&d<=fim)tot+=c.valor*w})});return tot}
function negsDe(ids){const n=[...ids];if(ids.includes("g1")&&ids.includes("g2"))n.push("geladeiras");if(ids.length>=todosIds().length)n.push("geral");return n}
const viaEmprestimo=l=>l.negocio==="mm"&&l.pagoPor==="Dinheiro do empréstimo";

function vFinanceiro(){
  const sub=["resultado","despesas","socias","financiamentos"].includes(UI.fin)?UI.fin:"resultado";
  const subs=[["resultado","Resultado"],["despesas","Despesas"],["socias","Sócias"],["financiamentos","Financiamentos"]];
  const comFiltro=sub==="resultado"||sub==="despesas";
  let filtros="",per=null,prev=null,ids=todosIds();
  if(comFiltro){const ps=periodos();if(!UI.per||(UI.per!=="tudo"&&!ps.find(p=>p.ini===UI.per))){const pr=periodoRef();UI.per=pr?pr.ini:"tudo"}
    const i=ps.findIndex(p=>p.ini===UI.per);per=UI.per==="tudo"||i<0?{ini:"0000",fim:"9999",label:"desde o início",tudo:true}:ps[i];prev=i>0?ps[i-1]:null;
    const as=ativosList();const fneg=UI.fneg&&UI.fneg!=="tudo"&&S.ativos[UI.fneg]?UI.fneg:"tudo";ids=fneg==="tudo"?ids:[fneg];
    filtros=`<div class="finfil"><div class="chipsel" role="group" aria-label="Negócio"><button data-fneg="tudo" aria-pressed="${fneg==="tudo"}">Tudo</button>${as.map(x=>`<button data-fneg="${x.id}" aria-pressed="${x.id===fneg}">${esc(curto(x))}</button>`).join("")}</div>
      <div class="field"><label for="fin-per">Período</label><select id="fin-per" data-per>${ps.map(p=>`<option value="${p.ini}"${UI.per===p.ini?" selected":""}>${esc(p.label)}</option>`).join("")}<option value="tudo"${UI.per==="tudo"?" selected":""}>Desde o início</option></select></div></div>`}
  const corpo=sub==="resultado"?finResultado(per,prev,ids):sub==="despesas"?finDespesas(per,ids):sub==="socias"?finSocias():finFinanciamentos();
  return `<div class="head"><div><h1>Financeiro</h1><p>Resultado, despesas, parte de cada uma e parcelas</p></div></div>
  <section>
    <div class="seg subtabs" role="tablist" aria-label="Partes do financeiro">${subs.map(([k,l])=>`<button role="tab" data-fin="${k}" aria-pressed="${k===sub}" aria-selected="${k===sub}">${l}</button>`).join("")}</div>
    ${S.canWrite?`<div class="shortcuts"><button class="shortcut" data-sheet="despesa" data-neg="${ids.length===1?esc(ids[0]):"geral"}">${I.coin}Lançar despesa</button><button class="shortcut" data-sheet="repasse">${I.swap}Lançar repasse</button></div>`:""}
    ${filtros}
    ${corpo}
  </section>`;
}

function finResultado(per,prev,ids){
  const R=lucroEntre(per.ini,per.fim,ids);const parc=parcelasEntre(per.ini,per.fim,ids);const sobra=R.lucro-parc;
  if(!R.dias&&!R.desp&&!parc)return `<div class="card"><div class="alert">${I.alert}<span>Sem vendas importadas neste período.</span>${S.canWrite?`<button class="btn small" data-sheet="importar">Importar</button>`:""}</div></div>`;
  const P=prev?lucroEntre(prev.ini,prev.fim,ids):null;const pparc=prev?parcelasEntre(prev.ini,prev.fim,ids):0;const comp=P&&P.dias;
  const est=taxaEstimada("debito")?'<span class="est">taxas est.</span>':"";
  const cor=v=>v<0?"var(--bad)":"var(--ok)";
  const var_=(a,b)=>{if(!comp)return "";const d=a-b;return `<td class="r note ant">${brl0(b)}</td><td class="r" style="color:${Math.abs(d)<0.5?"var(--muted)":d>0?"var(--ok)":"var(--bad)"};font-weight:700">${Math.abs(d)<0.5?"=":(d>0?"+":"−")+brl0(Math.abs(d))}</td>`};
  const ln=(k,v,pv,cls="")=>`<tr class="${cls}"><td>${k}</td><td class="r">${brl(v)}</td>${var_(v,pv)}</tr>`;
  const negativo=(k,v,pv)=>ln(k,-v,-pv);
  const linhas=[ln("Vendas",R.receita,P&&P.receita),negativo("Custo dos produtos",R.custo,P&&P.custo),ln("Margem dos produtos",R.receita-R.custo,P&&(P.receita-P.custo),"sub"),
    negativo("Taxas de cartão e Pix",R.taxas,P&&P.taxas),negativo("Local (comissão ou aluguel)",R.local,P&&P.local),negativo("Sistema e energia",R.fixos,P&&P.fixos),negativo("Despesas",R.desp,P&&P.desp),
    ln("Lucro da operação",R.lucro,P&&P.lucro,"tot"),negativo("Parcelas dos financiamentos",parc,pparc),ln("Sobra para as sócias",sobra,P&&(P.lucro-pparc),"tot"),ln("Cada uma (50%)",sobra/2,P&&(P.lucro-pparc)/2,"sub")];
  let porNeg="";
  if(ids.length>1){const as=ativosList();let sL=0,sP=0;
    const rows=as.map(a=>{const r=lucroEntre(per.ini,per.fim,[a.id]);const p=parcelasEntre(per.ini,per.fim,[a.id]);sL+=r.lucro;sP+=p;
      return `<tr><td><b style="font-weight:700">${esc(a.nome)}</b></td><td class="r hm">${brl0(r.receita)}</td><td class="r" style="color:${r.lucro<0?"var(--bad)":"inherit"}">${brl0(r.lucro)}</td><td class="r">${p?"−"+brl0(p):"—"}</td><td class="r" style="color:${r.lucro-p<0?"var(--bad)":"inherit"};font-weight:800">${brl0(r.lucro-p)}</td></tr>`}).join("");
    const resto=R.lucro-sL,rp=parc-sP;
    porNeg=`<div class="card"><h2 style="margin-bottom:6px">Cada negócio</h2><p class="sub" style="margin-bottom:8px">Lucro da operação e sobra depois das parcelas, lado a lado</p>
      <div class="tbl"><table><thead><tr><th>Negócio</th><th class="r hm">Vendeu</th><th class="r">Lucro</th><th class="r">Parcelas</th><th class="r">Sobra</th></tr></thead><tbody>${rows}
      ${Math.abs(resto)>0.5||Math.abs(rp)>0.5?`<tr><td class="note">Gerais e das duas geladeiras</td><td class="hm"></td><td class="r">${brl0(resto)}</td><td class="r">${Math.abs(rp)>0.5?"−"+brl0(rp):"—"}</td><td class="r">${brl0(resto-rp)}</td></tr>`:""}</tbody></table></div></div>`}
  return `<div class="card"><h2 style="margin-bottom:12px">${esc(per.label[0].toUpperCase()+per.label.slice(1))}${per.aberto?' <span class="note">(até hoje)</span>':""}</h2>
      <div class="big3"><div><div class="k">Vendeu</div><div class="v">${brl0(R.receita)}</div></div><div><div class="k">Lucro da operação${est}</div><div class="v" style="color:${cor(R.lucro)}">${brl0(R.lucro)}</div></div><div><div class="k">Sobra para as sócias</div><div class="v" style="color:${cor(sobra)}">${brl0(sobra)}</div></div></div></div>
    <div class="card"><h2 style="margin-bottom:6px">De onde veio e para onde foi</h2><p class="sub" style="margin-bottom:8px">${comp?"Comparado com "+esc(prev.label):"Conta completa do período"}</p>
      <div class="tbl"><table class="dre">${comp?`<thead><tr><th></th><th class="r">Este período</th><th class="r ant">Anterior</th><th class="r">Diferença</th></tr></thead>`:""}<tbody>${linhas.join("")}</tbody></table></div>
      <p class="note" style="margin-top:10px"><b>Lucro da operação</b> mostra se os negócios dão lucro. <b>Sobra para as sócias</b> desconta as parcelas do cartão e do empréstimo que vencem no período: é o que fica de fato.${per.aberto?" O período ainda está aberto, então os números vão mudar.":""}</p></div>
    ${porNeg}`;
}

function finDespesas(per,ids){
  const negs=negsDe(ids);const cats=catsDesp();
  const doPer=S.lancamentos.filter(l=>l.tipo==="despesa"&&negs.includes(l.negocio)&&l.data>=per.ini&&l.data<=per.fim);
  const cat=l=>l.categoria||"Sem categoria";
  const tot={};doPer.filter(l=>!viaEmprestimo(l)).forEach(l=>tot[cat(l)]=(tot[cat(l)]||0)+(+l.valor||0));
  const total=Object.values(tot).reduce((s,v)=>s+v,0);const ord=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
  const fcat=UI.fcat&&UI.fcat!=="todas"?UI.fcat:"todas";
  const lista=doPer.filter(l=>fcat==="todas"||cat(l)===fcat).sort((x,y)=>((y.data||"")+(y.criadoEm||""))<((x.data||"")+(x.criadoEm||""))?-1:1);
  const emp=doPer.filter(viaEmprestimo).reduce((s,l)=>s+(+l.valor||0),0);
  const inv=S.lancamentos.filter(l=>l.tipo==="investimento"&&negs.includes(l.negocio)&&l.data>=per.ini&&l.data<=per.fim).reduce((s,l)=>s+(+l.valor||0),0);
  const dis=S.canWrite?"":" disabled";
  return `<div class="card"><div class="card-head"><div><h2>Para onde foi o dinheiro</h2><p class="sub">${doPer.length} despesa${doPer.length===1?"":"s"} · ${brl(total)} entram no lucro</p></div></div>
      ${ord.length?ord.map(([k,v])=>`<button class="catrow" data-fcat="${esc(fcat===k?"todas":k)}" aria-pressed="${fcat===k}"><span class="cn">${esc(k)}</span><span class="prog"><span style="width:${total?Math.max(3,v/total*100):0}%"></span></span><b class="num">${brl0(v)}</b></button>`).join("")
        :`<div class="empty">Nenhuma despesa lançada neste período.${S.canWrite?`<br><button class="btn small" style="margin-top:10px" data-sheet="despesa" data-neg="${ids.length===1?esc(ids[0]):"geral"}">Lançar a primeira</button>`:""}</div>`}
      ${emp||inv?`<p class="note" style="margin-top:10px">${emp?`Pagas com o dinheiro do empréstimo (não entram no lucro): ${brl(emp)}. `:""}${inv?`Equipamentos e obras no período (investimento, fora do lucro): ${brl(inv)}.`:""}</p>`:""}</div>
    ${doPer.length?`<div class="card"><div class="card-head"><div><h2>${fcat==="todas"?"Todas as despesas":esc(fcat)}</h2><p class="sub">${lista.length} lançamento${lista.length===1?"":"s"} · ${brl(lista.reduce((s,l)=>s+(+l.valor||0),0))}</p></div>
      <div class="field"><label for="fin-cat">Categoria</label><select id="fin-cat" data-pf="fcat"><option value="todas">Todas</option>${[...new Set([...cats,...doPer.map(cat)])].map(c=>`<option${fcat===c?" selected":""}>${esc(c)}</option>`).join("")}</select></div></div>
      ${lista.length?histTable(lista,true):`<div class="empty">Nada nesta categoria.</div>`}</div>`:""}
    <div class="card"><details class="more"><summary>Categorias de despesa</summary>
      <p class="note" style="margin:10px 0">Renomear muda também as despesas já lançadas com aquele nome.</p>
      <div class="catlist">${cats.map(c=>`<form class="catedit" data-form="catren" data-old="${esc(c)}"><input name="nome" value="${esc(c)}" aria-label="Nome da categoria ${esc(c)}"${dis}><span class="note">${S.lancamentos.filter(l=>l.tipo==="despesa"&&l.categoria===c).length} lanç.</span><button class="btn small" type="submit"${dis}>Renomear</button></form>`).join("")}
      <form class="catedit" data-form="catnova"><input name="nome" placeholder="Nova categoria" aria-label="Nova categoria"${dis}><span></span><button class="btn small primary" type="submit"${dis}>Criar</button></form></div></details></div>`;
}

function finSocias(){
  const ex=extrato();const [A,B]=SOCIAS();const modo=S.config.fechamento||"mes";const dis=S.canWrite?"":" disabled";
  const col=p=>{const bg=p.saldo>0.01?"var(--orange-soft)":p.saldo<-0.01?"var(--petrol-soft)":"var(--ok-soft)";
    return `<div class="card who"><div class="head2"><div class="av">${esc(p.nome[0])}</div><div><h2>${esc(p.nome)}</h2><p class="sub">50% de tudo${p.isConta?" · as vendas caem na conta dela":""}</p></div></div>
      <div class="bigbox" style="background:${bg}"><div class="k">${p.saldo>0.01?"Tem a receber":p.saldo<-0.01?(p.isConta?"Tem a repassar para "+esc(p.nome===A?B:A):"Recebeu a mais que a parte dela"):"Tudo repassado"}</div><div class="v">${brl(Math.abs(p.saldo))}</div></div>
      <dl class="facts"><dt>Parte dela no lucro, desde o início</dt><dd>${brl(p.parte)}</dd><dt>${p.isConta?"Ficou na conta dela":"Já recebeu"}</dt><dd>${brl(p.comConta)}</dd><dt>Pagou do bolso (parcelas e compras)</dt><dd>${brl(p.bolso)}</dd>${p.deveAc?`<dt>Deve de acerto de despesas</dt><dd style="color:var(--warn)">${brl(p.deveAc)}</dd>`:""}<dt>Investimento dela</dt><dd>${brl0(p.inv)}</dd></dl>
      <div><div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px"><span>Já voltou do investimento</span><span>${pct(p.inv?p.parte/p.inv:0,1)}</span></div><div class="prog p"><div style="width:${Math.min(100,Math.max(0,p.inv?p.parte/p.inv*100:0))}%"></div></div></div></div>`};
  const st={pago:["ok","Repassado"],parcial:["warn","Parcial"],areceber:["bad","A repassar"],aberto:["info","Em andamento"],zero:["",""],info:["",""]};
  const ac=acerto();
  return `<div class="grid g2">${col(ex.A)}${col(ex.B)}</div>
    <div class="card"><h2>Acerto de despesas</h2><p class="sub" style="margin-bottom:8px">Quando uma paga algo do bolso, a outra deve metade</p><p style="font-weight:800;font-size:17px;margin:0">${Math.abs(ac.saldo)<0.01?"Ninguém deve nada":ac.saldo>0?`${esc(B)} deve ${brl(ac.saldo)} a ${esc(A)}`:`${esc(A)} deve ${brl(-ac.saldo)} a ${esc(B)}`}</p></div>
    <div class="card"><div class="card-head"><div><h2>Repasses mês a mês</h2><p class="sub">O lucro da operação de cada período e quanto já foi repassado${ex.ultV?" · vendas importadas até "+fmtDM(ex.ultV):""}</p></div></div>
      <div class="tbl"><table><thead><tr><th>Período</th><th class="r">Vendeu</th><th class="r">Lucro</th><th class="r">Cada uma</th>${ex.alvo?`<th class="r">Repassado</th><th></th>`:""}</tr></thead><tbody>
      ${ex.ps.slice().reverse().map(p=>{if(p.semDados)return `<tr><td>${esc(p.label)}</td><td colspan="${ex.alvo?5:3}" class="note">Aguardando o relatório de vendas</td></tr>`;const s=st[p.status]||["",""];return `<tr><td>${esc(p.label)}${p.aberto?' <span class="note">(até hoje)</span>':""}</td><td class="r">${brl0(p.receita)}</td><td class="r" style="color:${p.lucro<0?"var(--bad)":"inherit"}">${brl0(p.lucro)}</td><td class="r">${brl(p.parte)}</td>${ex.alvo?`<td class="r">${brl(p.pago)}</td><td>${s[1]?`<span class="pill ${s[0]}">${s[1]}</span>`:""}</td>`:""}</tr>`}).join("")}
      </tbody></table></div>
      <details class="more"><summary>Regras do cálculo</summary><div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
        <div class="form"><div class="field"><label>Fechamento</label><div class="seg"><button data-fech="mes" aria-pressed="${modo==="mes"}"${dis}>Mês fechado</button><button data-fech="dia20" aria-pressed="${modo==="dia20"}"${dis}>Dia 20 a 19</button></div></div>
        <div class="field"><label for="cfg-conta">As vendas caem na conta de</label><select id="cfg-conta" data-cfg="contaVendas"${dis}>${[[A,A],[B,B],["empresa","Conta da empresa"]].map(([v,l])=>`<option value="${esc(v)}"${ex.conta===v?" selected":""}>${esc(l)}</option>`).join("")}</select></div></div>
        <p class="note">O repasse é feito sobre o lucro da operação (vendas − custo dos produtos − taxas − local − sistema e energia − despesas). As parcelas do cartão e do empréstimo ficam fora: cada uma paga a sua metade, e isso aparece em "Pagou do bolso". Em Resultado dá para ver a sobra depois das parcelas.</p></div></details></div>`;
}

function finFinanciamentos(){
  const fins=Object.entries(S.financiamentos).map(([id,f])=>({id,f,r:finResumo(f)}));
  if(!fins.length)return `<div class="card empty">Nenhum financiamento cadastrado.</div>`;
  const ativos=fins.filter(x=>x.r.prox);const resta=fins.reduce((s,x)=>s+x.r.resta,0);const mensal=ativos.reduce((s,x)=>s+(+x.f.parcela||0),0);
  const prox=[];ativos.forEach(({f,r})=>r.c.filter(c=>!c.pago).slice(0,6).forEach(c=>prox.push({nome:f.nome,c})));prox.sort((a,b)=>a.c.dt-b.c.dt);
  const quando=c=>c.diaIncerto?fmtMesC(c.mes):fmtData(isoD(c.dt));

function lerRelatorio(file){const rd=new FileReader();rd.onload=e=>{try{
  if(typeof XLSX==="undefined")throw new Error("O leitor de Excel não carregou. Recarregue a página.");
  const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});
  const hi=rows.findIndex(r=>r&&String(r[0]).trim()==="Data/hora");if(hi<0)throw new Error('Não encontrei a coluna "Data/hora". Use o relatório "Transações cashless" do VMbox.');
  const H=rows[hi].map(h=>String(h||"").trim());const ix=k=>H.indexOf(k);
  const c={dt:ix("Data/hora"),maq:ix("Máquina"),loc:ix("Local"),st:ix("Estado"),prod:ix("Produto"),val:ix("Valor (R$)"),custo:ix("Preço de Custo (R$)"),tc:ix("Tipo de cartão"),aut:ix("Autorizador"),qtd:ix("Quantidade")};
  if(c.prod<0||c.val<0)throw new Error("Faltam as colunas Produto ou Valor (R$).");
  const linhas=rows.slice(hi+1).filter(r=>r&&r[c.dt]&&(c.st<0||String(r[c.st]).trim()==="OK"));
  const precos={};linhas.forEach(r=>{const p=r[c.prod];const v=+r[c.val]||0;(precos[p]=precos[p]||{})[v]=(precos[p][v]||0)+1});
  const moda={};for(const p in precos)moda[p]=+Object.entries(precos[p]).sort((a,b)=>b[1]-a[1])[0][0];
  const out={arquivo:file.name,maquinas:{},n:0,receita:0,ini:null,fim:null,map:{}};
  linhas.forEach(r=>{let dt=r[c.dt],iso,h;
    if(typeof dt==="number"){const d=XLSX.SSF.parse_date_code(dt);iso=d.y+"-"+String(d.m).padStart(2,"0")+"-"+String(d.d).padStart(2,"0");h=d.H}
    else{const m=String(dt).match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2})/);if(!m)return;iso=m[3]+"-"+m[2]+"-"+m[1];h=+m[4]}
    const maq=String((c.maq>=0&&r[c.maq])||(c.loc>=0&&r[c.loc])||"Máquina").trim();const p=String(r[c.prod]||"Sem nome");const v=+r[c.val]||0;const cu=+(c.custo>=0?r[c.custo]:0)||0;
    let q=parseInt(String(c.qtd>=0?r[c.qtd]:"1"))||1;if(q===1&&moda[p]&&v>moda[p]*1.5)q=Math.max(1,Math.round(v/moda[p]));
    const tc=String(c.tc>=0?r[c.tc]||"":"");const au=String(c.aut>=0?r[c.aut]||"":"");const tipo=tc.startsWith("Déb")?"debito":tc.startsWith("Cré")?"credito":/pix/i.test(au)?"pix":"outro";
    const M=out.maquinas[maq]||(out.maquinas[maq]={n:0,receita:0,dias:{}});
    const D=M.dias[iso]||(M.dias[iso]={data:iso,mes:iso.slice(0,7),n:0,q:0,receita:0,custo:0,pag:{debito:0,credito:0,pix:0,outro:0},horas:Array(24).fill(0),itens:{}});
    D.n++;D.q+=q;D.receita+=v;D.custo+=cu*q;D.pag[tipo]+=v;D.horas[h]+=v;const it=D.itens[p]||(D.itens[p]={p,q:0,v:0,c:0});it.q+=q;it.v+=v;it.c+=cu*q;
    M.n++;M.receita+=v;out.n++;out.receita+=v;if(!out.ini||iso<out.ini)out.ini=iso;if(!out.fim||iso>out.fim)out.fim=iso});
  if(!out.n)throw new Error("O arquivo não tem vendas com estado OK.");
  for(const nome in out.maquinas){const a=vendings().find(a=>a.vmNome&&norm(a.vmNome)===norm(nome));if(a)out.map[nome]=a.id}
  SH.imp=out}catch(err){SH.imp={erro:err.message||String(err)}}renderSheet()};rd.readAsArrayBuffer(file)}
async function importar(){const imp=SH.imp;imp.salvando=true;const jobs=[];
  for(const nome in imp.maquinas){const maq=imp.map[nome];for(const iso in imp.maquinas[nome].dias){const D=imp.maquinas[nome].dias[iso];
    jobs.push([maq+"_"+iso.replace(/-/g,""),{maquina:maq,data:D.data,mes:D.mes,n:D.n,q:D.q,receita:r2(D.receita),custo:r2(D.custo),pag:Object.fromEntries(Object.entries(D.pag).map(([k,v])=>[k,r2(v)])),horas:D.horas.map(r2),itens:Object.values(D.itens).map(i=>({p:i.p,q:i.q,v:r2(i.v),c:r2(i.c)})),origem:imp.arquivo}])}}
  let i=0;try{for(const [id,doc] of jobs){imp.prog=(++i)+"/"+jobs.length;if(i%5===1)renderSheet();await DB.collection("vendas").doc(id).set(doc)}
    const novos=Object.values(imp.map);for(const id of new Set(novos))if(!(S.ativos[id]||{}).vmNome){const nome=Object.keys(imp.map).find(k=>imp.map[k]===id);await DB.doc("ativos/"+id).update({vmNome:nome})}
    closeSheet();toast("Vendas importadas: "+jobs.length+" dias")}catch(e){imp.salvando=false;renderSheet();toast(erroMsg(e))}}

function carregarFoto(file,id){const img=new Image();const url=URL.createObjectURL(file);
  img.onload=async()=>{const s=Math.min(1,1000/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    let q=.82,data=cv.toDataURL("image/jpeg",q);while(data.length>230000&&q>.4){q-=.12;data=cv.toDataURL("image/jpeg",q)}
    try{await DB.doc("ativos/"+id).update({foto:data,fotoLegenda:""});toast("Foto salva")}catch(e){toast(erroMsg(e))}};
  img.onerror=()=>{toast("Não consegui abrir essa imagem.");URL.revokeObjectURL(url)};img.src=url}

async function onCode(code){if(!SC)return;code=String(code||"").replace(/\D/g,"");if(!code)return;const now=Date.now();if(code===SC.last&&now-SC.lastT<2200)return;SC.last=code;SC.lastT=now;
